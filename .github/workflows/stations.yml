name: Fetch road stations
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: stations
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: live
      - run: python3 scripts/fetch_stations.py live/stations.json
      - name: Save to the data branch as a single commit
        run: |
          cd live
          git config user.name "routewatch-bot"
          git config user.email "routewatch-bot@users.noreply.github.com"
          git add stations.json
          git commit -q --amend -m "Road station readings"
          git push -q -f origin data
